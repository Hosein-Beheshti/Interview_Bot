name: retention-sweep

# Erase sessions past the retention window. Uploaded CVs are personal data from
# people trying a public demo, so the promise in the UI has to be kept by
# something that actually runs.
#
# It lives here rather than in the API process for the reason given in
# scripts/purge_expired.py: an in-process timer would run once per replica,
# compete with request traffic, and die silently on the next deploy. Render's
# free tier has no cron, and this is free.
#
# Requires one repository secret: DATABASE_URL (the same Neon connection string
# the API uses). Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: "30 3 * * *" # daily, 03:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true

defaults:
  run:
    working-directory: backend

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Sweep
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/purge_expired.py --dry-run
          else
            python scripts/purge_expired.py
          fi
