# Render Blueprint — the backend API.
#
# The database is NOT defined here: Render's own free Postgres expires after 30
# days and has no pgvector. Neon's free tier has both, permanently, so
# DATABASE_URL points there instead (see docs/deployment.md).
#
# Secrets are declared with `sync: false`, which means Render prompts for them
# once at deploy time and stores them encrypted. They are never in this file.

services:
  - type: web
    name: interview-bot-api
    runtime: docker
    plan: free
    # Free instances sleep after 15 minutes idle and take ~50s to wake. Upgrade
    # to `starter` ($7/mo) to remove that, or see the keep-warm note in the docs.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Liveness, deliberately dependency-free: a database blip must not make
    # Render kill a container that is otherwise serving fine.
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ---- Secrets: entered once in the Render dashboard, never committed ----
      - key: DATABASE_URL
        sync: false # Neon connection string, must include ?sslmode=require
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false # CV embeddings; without it, CV upload fails
      - key: DEEPGRAM_API_KEY
        sync: false # speech in/out; without it, voice fails but text works

      # ---- Public deployment ----
      - key: LLM_PROVIDER
        value: anthropic
      - key: TRANSPORT_MODE
        value: live
      # Render terminates TLS in front of the container, so the socket address is
      # always the proxy's. Without this every visitor shares one rate-limit
      # bucket. It is only safe *because* a proxy is guaranteed to be in front.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Set to the Cloudflare Pages URL after the frontend is deployed. Until
      # then the browser will refuse the cross-origin call.
      - key: CORS_ORIGINS
        sync: false

      # ---- Admission control ----
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # The backstop on the bill. 500k tokens/day on Haiku 4.5 is roughly
      # $0.60/day (~$18/month) at the worst case of a 90/10 input/output split —
      # less in practice, since cached reads bill at a tenth. Reaching it returns
      # 503 until the window rolls over. Set it to a number you would be content
      # to pay on the worst day.
      - key: DAILY_TOKEN_CEILING
        value: "500000"
      - key: SESSIONS_PER_HOUR_PER_IP
        value: "5"
      - key: TURNS_PER_HOUR_PER_IP
        value: "60"
      - key: CV_UPLOADS_PER_HOUR_PER_IP
        value: "5"
      - key: TRANSCRIPTIONS_PER_HOUR_PER_IP
        value: "60"
      - key: TTS_CHARS_PER_DAY_PER_IP
        value: "20000"

      # ---- Retention ----
      - key: SESSION_RETENTION_DAYS
        value: "30"

      # ---- Observability (off unless you run a Langfuse instance) ----
      - key: LANGFUSE_ENABLED
        value: "false"
