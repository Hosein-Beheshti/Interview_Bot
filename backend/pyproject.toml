[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-bot"
version = "1.0.0"
description = "AI interview / candidate-evaluation agent: CV ingestion, rubric scoring, FSM interview loop."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
# `src` on the path lets tests import the installed package; the repo-root dirs
# (tests, fixtures, scripts, evals) are dev-only and live outside the package.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long prompt strings are fine. B008: FastAPI's Depends()/File() in
# argument defaults is the framework's intended idiom, not a bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]

# The dependency rule, enforced mechanically (run: lint-imports).
[tool.importlinter]
root_package = "interview_bot"

[[tool.importlinter.contracts]]
name = "domain is pure — imports no outer layer, config, or SDK"
type = "forbidden"
source_modules = ["interview_bot.domain"]
forbidden_modules = [
    "interview_bot.config",
    "interview_bot.prompts",
    "interview_bot.llm",
    "interview_bot.pipeline",
    "interview_bot.api",
    "interview_bot.persistence",
    "interview_bot.telemetry",
    "interview_bot.integrations",
    "interview_bot.retrieval",
]

[[tool.importlinter.contracts]]
name = "prompts depend only on the domain"
type = "forbidden"
source_modules = ["interview_bot.prompts"]
forbidden_modules = [
    "interview_bot.llm",
    "interview_bot.pipeline",
    "interview_bot.api",
    "interview_bot.persistence",
    "interview_bot.integrations",
    "interview_bot.retrieval",
]

[[tool.importlinter.contracts]]
name = "the LLM waist stays provider-agnostic upward (no pipeline/api/domain)"
type = "forbidden"
source_modules = ["interview_bot.llm"]
forbidden_modules = [
    "interview_bot.pipeline",
    "interview_bot.api",
    "interview_bot.retrieval",
]
